[book]
authors = ["Mike Taghavi"]
language = "en"
src = "src"
title = "The Jetro Book"
description = "Query, transform, and patch JSON with the jetro DSL"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/mitghi/jetro-book"
edit-url-template = "https://github.com/mitghi/jetro-book/edit/main/{path}"
site-url = "/jetro-book/"
additional-css = ["theme/extra.css", "theme/jetro.css"]
additional-js = ["theme/jetro.hljs.js"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true

[rust]
edition = "2021"
